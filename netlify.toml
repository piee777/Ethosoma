# Ethosoma — Netlify configuration

[build]
  # The publish dir is pinned here so every deploy path (CLI uploads, netlify
  # dev, previews) serves the same tree. Without it, CLI deploys can resolve
  # publish to the repo root — which would upload .env, .git, node_modules, etc.
  publish = "frontend"
  functions = "netlify/functions"

[dev]
  # Serves frontend/ statically and mounts netlify/functions/ at
  # /.netlify/functions/*. No framework command is needed — the site is
  # plain static HTML plus one Function.
  publish = "frontend"
  port = 8888
  autoLaunch = false

# ─── Private admin console ─────────────────────────────────────────────────
# The dashboard is client-gated, so the response body is never sensitive by
# itself — but a private console should still never be indexed, framed, or
# written to a shared cache.

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'"

[[headers]]
  for = "/js/admin.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/css/admin.css"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    X-Content-Type-Options = "nosniff"

# ─── Analytics function ────────────────────────────────────────────────────
# Telemetry responses must never be served from a shared cache, and the
# payloads are explicitly marked uncacheable for search engines.

[[headers]]
  for = "/.netlify/functions/analytics"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
